server_tokens off;

map $sent_http_content_type $cache_policy {
    default                     "no-cache";
    ~*text/html                 "no-cache";
    ~*(css|javascript)          "public, max-age=604800";
    ~*(image|font)              "public, max-age=2592000, immutable";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # www -> без www (одна версия сайта для поисковиков)
    if ($http_host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml font/woff;

    add_header Cache-Control $cache_policy always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # только чтение: прочие методы запрещены
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # служебные и скрытые файлы не отдаём
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(md|conf|sh|yml|yaml|env|bak|log)$ { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
