# /etc/nginx/sites-available/oltech — сайт oltech24.ru на российском сервере (без Docker)
server {
    listen 80;
    listen [::]:80;
    server_name oltech24.ru www.oltech24.ru;
    root /var/www/oltech;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml font/woff;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://mc.yandex.ru; frame-src blob: https://mc.yandex.ru; child-src blob: https://mc.yandex.ru; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # служебные файлы репозитория не отдаём
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(md|conf|sh|yml|yaml|env|bak|log)$ { deny all; return 404; }
    location ^~ /deploy/ { deny all; return 404; }
    location = /Dockerfile { deny all; return 404; }

    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; }
    location ~* \.(webp|png|jpg|woff)$ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options "nosniff" always; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
